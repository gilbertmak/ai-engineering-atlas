services:
  atlas-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-engineer-insight-atlas:${ATLAS_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Keep the service private until a separately reviewed TLS proxy exists.
      - "127.0.0.1:${ATLAS_HTTP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The worker writes this on the host; the web service only reads it.
      ATLAS_CATALOG_PROJECTION_PATH: /app/state/projection/atlas-catalog-projection.json
    volumes:
      - ${ATLAS_STATE_DIR:-./var/atlas-state}:/app/state:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.status === 204 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

# Discovery is deliberately not a Compose service. It is a separately gated,
# Keychain-backed launchd job defined in ops/launchd/.
