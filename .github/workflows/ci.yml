name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - run: npm ci --include=optional
      - run: npm run typecheck
      - run: npm run lint
      - run: bun test
      - run: npm run build
      - run: ./ops/validate-production-readiness.sh
      - run: docker build --tag ai-engineer-insight-atlas:ci .
