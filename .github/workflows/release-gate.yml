name: Release readiness gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - run: npm ci
      - run: npm run typecheck && npm run lint && bun test && npm run build
      - run: ./ops/validate-production-readiness.sh
      - run: docker build --tag ai-engineer-insight-atlas:${{ github.sha }} .
      - name: Publish release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-${{ github.sha }}
          path: |
            .output/nitro.json
            docs/operations.md
            docs/source-discovery.md
          if-no-files-found: error
          retention-days: 90
